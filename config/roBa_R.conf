# COROPIT (25mm トラックボール) 対応
# shield 側 (kumamuk-git/zmk-config-roBa) の roBa_R.conf を上書きする

# センサーの向き: COROPIT では 180 度回転が不要になる
CONFIG_PMW3610_ORIENTATION_180=n
CONFIG_PMW3610_ORIENTATION_0=y

